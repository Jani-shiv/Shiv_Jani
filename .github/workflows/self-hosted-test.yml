name: Self-Hosted Runner Test

on:
  push:
    branches: [ main ]

jobs:
  run-on-ec2:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Host Diagnostics
        run: |
          echo "Job running on Self-Hosted EC2 Runner"
          hostname
          whoami
          uptime
